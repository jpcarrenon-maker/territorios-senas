<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Territorios Señas Centro</title>
<meta name="theme-color" content="#0e6e5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Territorios">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#0e6e5c;--fg:#fff;--soft:#d9efe9;--ink:#0b3d33}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font:18px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px));text-align:center;min-height:100vh}
img{width:128px;height:128px;border-radius:28px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
h1{margin:0;font-size:26px;line-height:1.2}
a.go{display:block;width:100%;max-width:340px;background:#fff;color:var(--ink);text-decoration:none;font-weight:800;font-size:22px;padding:20px 16px;border-radius:18px}
.tip{max-width:340px;font-size:16px;background:rgba(255,255,255,.14);border-radius:14px;padding:14px 16px;text-align:left}
.tip b{display:block;margin-bottom:4px}
.tip[hidden]{display:none}
</style>
</head>
<body>
<img src="icon-192.png" alt="Logo Territorios">
<h1>Territorios Señas Centro</h1>
<a class="go" id="go" href="https://script.google.com/macros/s/AKfycbxQYG9N7GQWa3y4-fpQizHbjo8iFI1yrg38fKSnbuPTA4ml1t85Sf4opf37lYKmgApNHA/exec">Abrir el mapa</a>
<div class="tip" id="tip"><b>Para tener el ícono en tu teléfono</b>En iPhone: toca el botón Compartir y elige «Agregar a pantalla de inicio». En Android: menú ⋮ y «Agregar a pantalla de inicio» o «Instalar app». Luego abre siempre desde ese ícono.</div>
<script>
(function(){
  var go=document.getElementById("go"),url=go.href;
  var standalone=(window.navigator.standalone===true)||(window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches);
  if(standalone){
    document.getElementById("tip").hidden=true;
    go.textContent="Abriendo…";
    location.replace(url);
  }
})();
</script>
</body>
</html>
